# Fork-only: builds a signed arm64 APK and publishes it as a GitHub release on every push to `eink`.
#
# Updating from upstream:
#   git fetch upstream && git merge upstream/develop
#   # if assets/foliate-js/dist/bundle.js conflicts, take upstream's and rebuild:
#   git checkout --theirs assets/foliate-js/dist && (cd assets/foliate-js && npm ci && npm run build)
#   git add -A && git commit && git push
name: E-ink Android

on:
  push:
    branches: [eink]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: fv
        run: echo "v=$(cat .github/flutter-version)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.fv.outputs.v }}

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Android signing
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=keystore.jks\n' \
            "${{ secrets.KEYSTORE_PASSWORD }}" "${{ secrets.KEY_PASSWORD }}" "${{ secrets.KEY_ALIAS }}" > android/key.properties

      - name: Build
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          TAG="eink-${VERSION}.${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk anx-reader-eink-arm64-v8a.apk
          gh release create "$TAG" anx-reader-eink-arm64-v8a.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Anx Reader e-ink $TAG" \
            --notes "Built from $GITHUB_SHA. Stable link: https://github.com/$GITHUB_REPOSITORY/releases/latest/download/anx-reader-eink-arm64-v8a.apk"
